# =============================================================================
# interpbench_smoke.yaml — InterpBench smoke test config (fast CI run)
# Inherits from: configs/default.yaml
# =============================================================================
_base_: "../default.yaml"

circuit:
  dataset: "interpbench"
  model_name: "gpt2"
  task_name: "tracr_reverse"
  candidate_top_k: 64
  eval_dataset_fraction: 0.05   # tiny slice for smoke test
  eval_batch_size: 8
  max_causal_forward_calls: 100
  faithfulness_guard_threshold: 0.0
  ground_truth_edges: []

episode:
  max_episode_steps: 30
  max_manager_decisions: 10
  option_horizon: 3
  allow_explicit_stop: true
  start_fully_included: true
  random_start_prob: 0.0

reward:
  alpha: 1.0
  beta: 0.05
  gamma_cost: 0.001
  lambda_guard: 2.0
  tau: 0.0
  terminal_bonus: 1.0
  terminal_faithfulness_min: 0.8
  use_potential_shaping: true
  include_cost_reward: true
  include_sparsity_reward: true

encoder:
  edge_feature_dim: 32
  region_feature_dim: 32
  global_feature_dim: 16
  use_positional_encoding: true
  num_attention_heads: 2
  num_encoder_layers: 1
  encoder_dropout: 0.0
  normalise_attributions: true

policy:
  arch: "mlp"
  hidden_sizes: [64, 64]
  activation: "relu"
  shared_backbone: false

ppo:
  num_envs: 2
  rollout_steps: 64
  ppo_epochs: 2
  mini_batch_size: 32
  learning_rate: 3.0e-4
  worker_learning_rate: 3.0e-4
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  normalise_advantages: true
  normalise_returns: false
  lr_schedule: "constant"
  total_timesteps: 10_000

hrl:
  enabled: true
  num_regions: 4
  manager_sees_global: true
  worker_sees_region: true
  worker_termination: "fixed_horizon"
  manager_entropy_coef: 0.01
  worker_entropy_coef: 0.01
  use_option_critic: false

eval:
  eval_interval_rollouts: 10
  num_eval_episodes: 3
  metrics: ["faithfulness", "sparsity", "f1", "iou", "num_edges"]
  save_best_mask: false
  success_faithfulness: 0.8
  success_sparsity: 0.2

logging:
  backend: "none"
  wandb_project: "hrl_circuit_localization_dev"
  wandb_entity: null
  log_interval_steps: 1_000
  checkpoint_interval_rollouts: 100
  checkpoint_dir: "checkpoints/smoke"
  log_trajectories: false
  log_grad_norms: false

seed: 42
deterministic_cudnn: true

compute:
  device: "cpu"
  precision: "fp32"
  num_data_workers: 0
  torch_compile: false
