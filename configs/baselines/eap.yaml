# =============================================================================
# baselines/eap.yaml — Edge Attribution Patching (EAP) baseline
# =============================================================================
_base_: "../default.yaml"

circuit:
  dataset: "mib"
  model_name: "gpt2"
  task_name: "ioi"
  candidate_top_k: 512
  eval_dataset_fraction: 1.0
  eval_batch_size: 32
  max_causal_forward_calls: 500

episode:
  max_episode_steps: 1   # Single-shot: EAP produces a mask in one pass
  allow_explicit_stop: false
  start_fully_included: true

hrl:
  enabled: false

# EAP-specific settings
baseline:
  method: "eap"
  # Attribution score aggregation: "mean" | "max" | "sum"
  aggregation: "mean"
  # Threshold on normalised attribution score to include an edge
  threshold: 0.1
  # Whether to use integrated gradients variant (plain EAP = false)
  use_integrated_gradients: false
  # Number of integration steps (unused when use_integrated_gradients=false)
  ig_steps: 20
  # Corruption distribution: "zero" | "mean" | "resample"
  corruption: "resample"

eval:
  eval_interval_rollouts: 1
  num_eval_episodes: 10
  metrics: ["faithfulness", "sparsity", "f1", "iou", "num_edges", "eval_calls"]
  save_best_mask: true
  success_faithfulness: 0.8
  success_sparsity: 0.2

logging:
  backend: "csv"
  checkpoint_dir: "checkpoints/baselines/eap"
  log_trajectories: false

seed: 42
compute:
  device: "auto"
  precision: "fp32"
