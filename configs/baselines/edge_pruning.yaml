# =============================================================================
# baselines/edge_pruning.yaml — Learned Edge Pruning baseline (SP/LP)
# =============================================================================
_base_: "../default.yaml"

circuit:
  dataset: "mib"
  model_name: "gpt2"
  task_name: "ioi"
  candidate_top_k: 512
  eval_dataset_fraction: 1.0
  eval_batch_size: 32
  max_causal_forward_calls: 500

episode:
  max_episode_steps: 1
  allow_explicit_stop: false
  start_fully_included: true

hrl:
  enabled: false

# Edge Pruning-specific settings
baseline:
  method: "edge_pruning"
  # Regularisation method: "l0" | "l1" | "sp"
  regularisation: "l0"
  # Regularisation coefficient
  reg_coef: 1.0e-3
  # Learning rate for the mask parameters
  mask_lr: 1.0e-2
  # Number of gradient steps for mask optimisation
  num_steps: 5000
  # Temperature for hard-concrete relaxation
  temperature: 2.0 / 3.0
  # Stretch parameters for hard-concrete (zeta, gamma)
  zeta: 1.1
  gamma: -0.1
  # Whether to use the structured variant (prune entire attention heads)
  structured: false
  # Threshold for binarising the learned continuous mask
  binarise_threshold: 0.5

eval:
  eval_interval_rollouts: 1
  num_eval_episodes: 10
  metrics: ["faithfulness", "sparsity", "f1", "iou", "num_edges", "eval_calls"]
  save_best_mask: true
  success_faithfulness: 0.8
  success_sparsity: 0.2

logging:
  backend: "csv"
  checkpoint_dir: "checkpoints/baselines/edge_pruning"
  log_trajectories: false

seed: 42
compute:
  device: "auto"
  precision: "fp32"
