_base_: "../hrl_ppo/base.yaml"

reward:
  include_sparsity_reward: false
  beta: 0.0

logging:
  checkpoint_dir: "checkpoints/ablations/no_sparsity_reward"
  backend: "tensorboard"

seed: 42
